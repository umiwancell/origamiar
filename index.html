<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Code-only Nature AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker type="pattern" url="tsuru.patt">
        
        <a-plane position="0 2 -4" width="12" height="8" 
                 material="shader: standard; color: #87CEEB; emissive: #00BFFF; emissiveIntensity: 0.2">
        </a-plane>

        <a-sphere position="2.5 3.5 -3.5" radius="0.4" color="#FFD700"
                  material="emissive: #FFA500; emissiveIntensity: 1">
        </a-sphere>

        <a-entity position="-1.5 2.5 -3" 
                  animation="property: position; from: -1.8 2.5 -3; to: -1.2 2.6 -3; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere position="0 0 0" radius="0.3" color="white" opacity="0.9"></a-sphere>
          <a-sphere position="0.3 0.1 0" radius="0.25" color="white" opacity="0.9"></a-sphere>
          <a-sphere position="-0.3 0 0" radius="0.2" color="white" opacity="0.9"></a-sphere>
        </a-entity>

        <a-circle rotation="-90 0 0" radius="2" color="#7cfc00" opacity="0.6"></a-circle>

        <a-entity position="0 2.5 -2.5"
                  animation="property: position; from: 3 0 0; to: -5 1 0; dur: 10000; loop: true; easing: linear">
            <a-text value="V" color="#333" rotation="0 0 0" align="center" width="4"></a-text>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
