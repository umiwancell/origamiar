<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Realistic Environment AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-marker type="pattern" url="tsuru.patt">
        
        <a-plane position="0 -2 -15" width="40" height="25" rotation="-20 0 0"
                 material="shader: standard; color: #add8e6; emissive: #4ebfff; emissiveIntensity: 0.5">
        </a-plane>
        
        <a-sphere position="6 10 -14" radius="1.2" color="white"
                  material="emissive: #ffcc00; emissiveIntensity: 2; roughness: 0">
        </a-sphere>

        <a-entity position="-5 5 -10">
          <a-sphere position="0 0 0" radius="1" color="white" opacity="0.6"></a-sphere>
          <a-sphere position="1.2 0.3 -0.5" radius="0.8" color="white" opacity="0.4"></a-sphere>
          <a-sphere position="-1 0.2 -0.2" radius="0.7" color="white" opacity="0.5"></a-sphere>
        </a-entity>
      </a-marker>

      <a-marker type="pattern" url="air.patt">
        
        <a-plane position="0 -2 -15" width="40" height="25" rotation="-20 0 0"
                 material="shader: standard; color: #2f2f2f; emissive: #4b3621; emissiveIntensity: 0.3">
        </a-plane>
        
        <a-sphere position="6 10 -14" radius="1.2" color="#555"
                  material="emissive: #332200; emissiveIntensity: 0.5"></a-sphere>

        <a-entity position="0 0 -8" animation="property: rotation; to: 0 360 0; dur: 20000; loop: true; easing: linear">
          <a-sphere position="0 2 0" radius="2" color="#111" opacity="0.8"></a-sphere>
          <a-sphere position="1.5 4 -1" radius="1.5" color="#333" opacity="0.7"></a-sphere>
          <a-sphere position="-1 5 0.5" radius="1.8" color="#222" opacity="0.9"></a-sphere>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
