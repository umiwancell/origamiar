<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>秋の公園 AR背景テスト</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <img id="sky-texture" src="autumn_park_1k.exr">
      </a-assets>

      <a-marker type="pattern" url="tsuru.patt">
        
        <a-sky 
          src="#sky-texture" 
          radius="10" 
          material="transparent: true; opacity: 0.9"
          animation="property: rotation; to: 0 360 0; dur: 100000; loop: true; easing: linear">
        </a-sky>

        <a-circle color="#88aa66" rotation="-90 0 0" radius="0.5" opacity="0.8"></a-circle>

      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
